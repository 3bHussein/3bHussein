name: Validate profile README
on:
  push:
    branches: [design/visual-profile-v2]
  pull_request:
    paths:
      - README.md
      - assets/**
      - .github/workflows/validate-profile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README assets and SVG XML
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          readme = Path("README.md").read_text(encoding="utf-8")
          assets = re.findall(r'(?:src|srcset)="(\./assets/[^"]+)"', readme)
          assets += re.findall(r'!\[[^]]*\]\((\./assets/[^)]+)\)', readme)
          assert assets, "No local assets found"
          for asset in assets:
              file = Path(asset.split("?")[0])
              assert file.is_file(), f"Missing image: {file}"
              if file.suffix == ".svg":
                  ET.parse(file)
          for file in Path("assets").glob("*.svg"):
              ET.parse(file)
          for heading in ["Featured Projects", "Tech Stack", "GitHub Activity", "About Me"]:
              assert heading in readme, f"Missing section: {heading}"
          for repo in ["ProgressX", "Project-Factory-AI", "vin-decoder-pro", "Cinematic-terminal-command-center-for-Kali-Linux"]:
              assert repo in readme, f"Missing project: {repo}"
          assert "ECU Warrior V2" not in readme
          assert "ghchart.rshah.org" not in readme, "Old white-background heatmap must not return"
          assert "github_dark" in readme, "Activity should keep dark theme"
          assert "https://github.com/3bHussein?tab=overview" in readme, "Official activity fallback missing"
          print(f"Validated {len(assets)} referenced images and all SVG files.")
      - name: Check external image endpoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          import urllib.request
          import urllib.error
          text = unescape(Path("README.md").read_text(encoding="utf-8"))
          images = set(re.findall(r'<img[^>]+src="(https?://[^"]+)"', text))
          images.update(re.findall(r'!\[[^]]*\]\((https?://[^)]+)\)', text))
          assert images, "No external image URLs found"
          failures = []
          for url in sorted(images):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (profile-validator)", "Accept": "image/*"})
              try:
                  with urllib.request.urlopen(req, timeout=18) as response:
                      content_type = response.headers.get("Content-Type", "")
                      if response.status != 200 or not content_type.startswith("image/"):
                          failures.append(f"{response.status} {content_type}: {url}")
                      else:
                          print("OK:", url.split("?")[0])
              except Exception as exc:
                  failures.append(f"{type(exc).__name__}: {url}")
          if failures:
              raise SystemExit("External images unavailable:\n" + "\n".join(failures))
          PY
